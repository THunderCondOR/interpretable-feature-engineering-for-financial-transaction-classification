dataset:
  name: gender
  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label
  label_names:
    "0": "женщина"
    "1": "мужчина"
  category_label: "категории трат"
  num_labels: 2
  metric: accuracy
  splits:
    train: data/gender/train.csv
    val:   data/gender/val.csv
    test:  data/gender/test.csv

llm:
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  max_concurrent: 2
  batch_size: 8
  request_cooldown_seconds: 1.0
  batch_cooldown_seconds: 20.0
  rate_limit_cooldown_seconds: 90.0
  retry_backoff: 5.0
  max_retries: 5
  temperature: 1.0
  top_p: 0.9

prompts:
  base_dir: "."
  system:        prompts/gender/explanation_generation/system_prompt.txt
  user:          prompts/gender/explanation_generation/user_prompt.txt
  claims_system: prompts/gender/claims_extraction/system_prompt.txt
  claims_user:   prompts/gender/claims_extraction/user_prompt.txt

lora:
  defaults:
    max_length: 1024
    lora_rank: 8
    lora_alpha: 8
    lora_dropout: 0.05
    learning_rate: 2.0e-4
    batch_size: 4
    gradient_accumulation_steps: 8
    num_epochs: 5
    load_in_4bit: true
  models:
    - name: qwen_1_5b
      model_name: "Qwen/Qwen2.5-1.5B-Instruct"
    - name: qwen_7b
      model_name: "Qwen/Qwen2.5-7B-Instruct"
    - name: qwen_14b
      model_name: "Qwen/Qwen2.5-14B-Instruct"

pipeline:
  n_explanation_samples: 3
  n_claims_samples: 3
  few_shot_per_class: 1
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  distance_threshold: 0.01
  class_diff_threshold: 0.02
  min_cluster_size: 1
  max_assign_distance: 0.45

optuna:
  n_trials: 30

output:
  base_dir:      results/gender
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  prompts:       prompts.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  metrics:       metrics.json

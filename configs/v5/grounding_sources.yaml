field_semantics:
  gender: >-
    Signed cashflow. Negative amounts denote outflow and positive amounts denote
    inflow. Category lists are top-k summaries, so an omitted category is not
    evidence that the client never used it.
  age: >-
    Amount is unsigned transaction value, not income or expense. Age labels are
    ordered proxy groups without exact age boundaries. Demographic or life-stage
    interpretations require transaction evidence.
  rosbank: >-
    Transaction direction is defined by operation type. Recency is measured from
    the fixed train-derived observation end. Category lists are top-k summaries.
  berka: >-
    The profile summarizes account transactions and related account attributes.
    Amount direction and operation semantics must be interpreted only as stated
    in the profile. Omitted top-k categories are unknown, not absent.
  datafusion_education: >-
    Amount is transaction value and category/activity fields describe only the
    observed transaction history. Education-related interpretations must be
    supported by the supplied evidence; lifestyle facts cannot be assumed.


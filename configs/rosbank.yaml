dataset:
  name: rosbank

  # Колонки после prepare_rosbank.py
  # mcc_code_desc = "MCC описание [тип операции]"  — основная категориальная
  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label

  label_names:
    0: "активный клиент"
    1: "отток"

  category_label: "категории операций"
  num_labels: 2
  metric: accuracy

  splits:
    train: data/rosbank/train.csv
    val:   data/rosbank/val.csv
    test:  data/rosbank/test.csv

llm:
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  max_concurrent: 16
  batch_size: 32
  temperature: 1.0
  top_p: 0.9

prompts:
  base_dir: prompts/rosbank
  system:        explanation_generation/system_prompt.txt
  user:          explanation_generation/user_prompt.txt
  claims_system: claims_extraction/system_prompt.txt
  claims_user:   claims_extraction/user_prompt.txt

lora:
  model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
  max_length: 1024
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 5
  load_in_4bit: true

pipeline:
  n_explanation_samples: 8
  n_claims_samples: 10
  distance_threshold: 0.01
  class_diff_threshold: 0.02
  pca_components: 50
  perplexity: 15

optuna:
  n_trials: 30

output:
  base_dir:      results/rosbank
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  features:      cot_features.parquet
  metrics:       metrics.json

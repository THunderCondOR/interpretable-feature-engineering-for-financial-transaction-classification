dataset:
  name: rosbank
  amount_semantics: typed_transaction_value
  amount_unit: dataset_native_units
  direction_rule: "direction is read from trx_cat_ru, not inferred from amount sign"
  observation_end: "2018-04-02 23:20:35"
  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label
  label_names:
    "0": "retained_client"
    "1": "churned_client"
  category_label: "transaction categories"
  prompt_task_description: "Predict whether the bank client is retained or churned."
  prompt_dataset_guidance: >-
    You may reason about engagement, primary- or secondary-bank use, declining
    activity, and possible attrition when these interpretations are supported
    by temporal and operation-type evidence. Transaction direction is defined
    by operation type, not by the amount sign.
  label_semantics: standard
  claim_forbidden_terms: [retained_client, churned_client, retained, churned, churn]
  num_labels: 2
  metric: accuracy
  splits:
    train: data/rosbank/train.csv
    val:   data/rosbank/val.csv
    test:  data/rosbank/test.csv

llm:
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "Qwen/Qwen3.5-122B-A10B"
  max_tokens: 8192
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  max_concurrent: 15
  batch_size: 15
  request_cooldown_seconds: 0.0
  batch_cooldown_seconds: 0.0
  rate_limit_cooldown_seconds: 90.0
  retry_backoff: 5.0
  max_retries: 5
  temperature: 0.8
  top_p: 0.9

prompts:
  base_dir: "."
  language: en
  contract_version: evidence_bounded_v4
  category_mapping_version: en_v1
  system:        prompts/common/explanation_generation/system_prompt.txt
  user:          prompts/common/explanation_generation/user_prompt.txt
  claims_system: prompts/common/claims_extraction/system_prompt.txt
  claims_user:   prompts/common/claims_extraction/user_prompt.txt

lora:
  defaults:
    max_length: 1536
    lora_rank: 8
    lora_alpha: 8
    lora_dropout: 0.05
    learning_rate: 2.0e-4
    batch_size: 4
    gradient_accumulation_steps: 8
    num_epochs: 5
    load_in_4bit: true
  models:
    - name: deepseek_qwen_1_5b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    - name: deepseek_qwen_7b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    - name: deepseek_qwen_14b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"

pipeline:
  n_explanation_samples: 1
  n_claims_samples: 1
  claims_max_tokens: 2048
  few_shot_per_class: 2
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  distance_threshold: 0.01
  class_diff_threshold: 0.02
  min_cluster_size: 2
  max_assign_distance: 0.45

optuna:
  n_trials: 30

output:
  base_dir:      results/rosbank
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  prompts:       prompts.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  metrics:       metrics.json

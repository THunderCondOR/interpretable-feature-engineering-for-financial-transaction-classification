dataset:
  name: rosbank

  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label

  label_names:
    "0": "активный клиент"
    "1": "отток"

  category_label: "категории операций"
  num_labels: 2
  metric: accuracy

  # train/val строятся из авторского labeled train subset;
  # test — авторский test subset. Если в нем нет target_flag, label = -1 и метрики на test не считаются.
  splits:
    train: data/rosbank/train.csv
    val:   data/rosbank/val.csv
    test:  data/rosbank/test.csv

llm:
  # OpenRouter is OpenAI-compatible. Export OPENROUTER_API_KEY before running.
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "deepseek/deepseek-r1-0528" # "Openai/Gpt-oss-120b"
  max_concurrent: 8
  batch_size: 16
  temperature: 0.8
  top_p: 0.9

prompts:
  base_dir: "prompts/rosbank"
  system:        explanation_generation/system_prompt.txt
  user:          explanation_generation/user_prompt.txt
  claims_system: claims_extraction/system_prompt.txt
  claims_user:   claims_extraction/user_prompt.txt

lora:
  model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  max_length: 1536
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 5
  load_in_4bit: true

pipeline:
  # Для быстрого первого прогона можно переопределить CLI: --max-clients-per-split 200
  n_explanation_samples: 1
  n_claims_samples: 1
  few_shot_per_class: 2
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"

  # train-only supervised filtering for CoT clusters
  class_diff_threshold: 0.02
  min_cluster_size: 2
  max_assign_distance: 0.45

optuna:
  n_trials: 30

output:
  base_dir:      results/rosbank
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  prompts:       prompts.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  features:      cot_features.parquet
  metrics:       metrics.json

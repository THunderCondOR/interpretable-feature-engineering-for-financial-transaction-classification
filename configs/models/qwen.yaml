llm:
  api_base_url: "${LLM_API_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  default_model: Qwen/Qwen3.5-122B-A10B
  max_tokens: 8192
  temperature: 0.8
  top_p: 0.9
  max_concurrent: 64
  batch_size: 64
  rate_limit_fallback_concurrent: 10
  rate_limit_recovery_batches: 10
  rate_limit_cooldown_seconds: 60
  max_retries: 5
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

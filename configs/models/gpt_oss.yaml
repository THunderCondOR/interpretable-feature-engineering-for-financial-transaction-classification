llm:
  api_base_url: "${LLM_API_BASE_URL}"
  api_key: "${LLM_API_KEY}"
  default_model: openai/gpt-oss-120b
  max_tokens: 8192
  temperature: 0.8
  top_p: 0.9
  max_concurrent: 64
  batch_size: 64
  rate_limit_fallback_concurrent: 10
  rate_limit_recovery_batches: 10
  rate_limit_cooldown_seconds: 60
  max_retries: 5

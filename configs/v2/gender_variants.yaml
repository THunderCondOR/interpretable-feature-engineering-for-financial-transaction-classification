pilot:
  split: val
  clients: 400
  sampling_seed: 137
  stratify_by: [label, transaction_count_quartile, transaction_volume_quartile]
  primary_metric: balanced_accuracy
  variants:
    - legacy
    - neutral_only
    - neutral_robust_fewshot
    - neutral_robust_zero_shot
  variant_settings:
    legacy:
      source: immutable_existing_predictions
    neutral_only:
      statistics.summary_profile: legacy_mean_categories
      pipeline.few_shot_strategy: random
    neutral_robust_fewshot:
      statistics.summary_profile: robust
      pipeline.few_shot_strategy: representative
      pipeline.few_shot_per_class: 2
      pipeline.few_shot_seed: 137
    neutral_robust_zero_shot:
      statistics.summary_profile: robust
      pipeline.few_shot_per_class: 0
  selection_rule:
    practical_equivalence_points: 1.0
    require_overlapping_confidence_intervals: true
    prefer_when_equivalent: neutral_robust_zero_shot
full_run:
  qwen_splits: [train, val, test]
  gpt_oss_direct_splits: [test]
  gpt_oss_claim_scope: grounding_subset
  reuse: [majority, lora]
  reevaluate_with_seeds: [standard, handcrafted]

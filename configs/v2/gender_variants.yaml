# Kept under the historical filename for compatibility.  The v4 pilot contract
# now applies identically to gender, age, and rosbank.
pilot:
  datasets: [rosbank, gender, age]
  split: val
  clients_per_dataset: 400
  sampling_seed: 137
  stratify_by:
    - label
    - transaction_count_quartile
    - absolute_transaction_volume_quartile
  primary_metric: balanced_accuracy
  variants:
    - guided_zero_shot_v4
    - guided_factual_fs1_v4
    - guided_factual_fs2_v4
  age_label_semantics: [age_opaque, age_ordered]
  shared_settings:
    statistics.summary_profile: robust_mean
    pipeline.few_shot_strategy: representative_medoid
    prompt.max_chars: null
  variant_settings:
    guided_zero_shot_v3:
      pipeline.few_shot_per_class: 0
    guided_factual_fs1_v3:
      pipeline.few_shot_per_class: 1
    guided_factual_fs2_v3:
      pipeline.few_shot_per_class: 2
  selection_rule:
    minimum_strict_balanced_accuracy_gain: 0.02
    paired_bootstrap_ci_lower_bound_must_exceed: 0.0
    fs1_tie_margin: 0.005
full_run:
  models: [qwen, gpt_oss]
  datasets: [gender, rosbank, age]
  splits: [train, val, test]
  stages: [stats, prompts, explanations, direct_eval, claims]

dataset:
  name: age
  split_policy: provided_test_ids
  official_test_ids: data/test_ids/age_test_ids.csv
  test_id_column: client_id
  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label
  label_names:
    "0": "18-25"
    "1": "26-35"
    "2": "36-45"
    "3": "46+"
  category_label: "типы операций"
  num_labels: 4
  metric: accuracy
  splits:
    train: data/age/train.csv
    val:   data/age/val.csv
    test:  data/age/test.csv

llm:
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "Qwen/Qwen3-235B-A22B-Instruct-2507"
  max_concurrent: 16
  batch_size: 32
  temperature: 1.0
  top_p: 0.9

prompts:
  base_dir: "."
  system:        prompts/age/explanation_generation/system_prompt.txt
  user:          prompts/age/explanation_generation/user_prompt.txt
  claims_system: prompts/age/claims_extraction/system_prompt.txt
  claims_user:   prompts/age/claims_extraction/user_prompt.txt

lora:
  model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  max_length: 1024
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_accumulation_steps: 8
  num_epochs: 5
  load_in_4bit: true

pipeline:
  n_explanation_samples: 8
  n_claims_samples: 10
  few_shot_per_class: 1
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  distance_threshold: 0.01
  class_diff_threshold: 0.02
  min_cluster_size: 1
  max_assign_distance: 0.45
  pca_components: 50
  perplexity: 15

optuna:
  n_trials: 30

output:
  base_dir:      results/age
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  prompts:       prompts.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  features:      cot_features.parquet
  metrics:       metrics.json

dataset:
  name: age
  amount_semantics: unsigned_transaction_value
  amount_unit: dataset_native_units
  direction_rule: "amount encodes transaction value; no income/outflow inference"
  columns:
    customer_id: customer_id
    datetime:    tr_datetime
    amount:      amount
    category:    mcc_code_desc
    label:       label
  label_names:
    "0": "age_group_A"
    "1": "age_group_B"
    "2": "age_group_C"
    "3": "age_group_D"
  label_order: [0, 1, 2, 3]
  exact_age_boundaries_available: false
  category_label: "transaction categories"
  prompt_task_description: "Predict the anonymized age-group class assigned by the dataset."
  prompt_dataset_guidance: >-
    The four age-group classes are anonymized. Their exact numerical
    boundaries and their order are not provided. You may formulate cautious
    life-stage interpretations, such as student-like, working-age,
    family-oriented, or retirement-like behavior, only when supported by the
    supplied transaction evidence. Do not assign a specific age.
  label_semantics: age_opaque
  claim_forbidden_terms: [age_group_A, age_group_B, age_group_C, age_group_D]
  num_labels: 4
  metric: accuracy
  splits:
    train: data/age/train.csv
    val:   data/age/val.csv
    test:  data/age/test.csv

llm:
  api_base_url: "${API_BASE_URL}"
  api_key:      "${API_KEY}"
  default_model: "Qwen/Qwen3.5-122B-A10B"
  max_tokens: 8192
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  max_concurrent: 88
  batch_size: 88
  request_cooldown_seconds: 0.0
  batch_cooldown_seconds: 0.0
  rate_limit_cooldown_seconds: 90.0
  retry_backoff: 5.0
  max_retries: 5
  temperature: 1.0
  top_p: 0.9

prompts:
  base_dir: "."
  language: en
  contract_version: evidence_bounded_v4
  category_mapping_version: en_v1
  system:        prompts/common/explanation_generation/system_prompt.txt
  user:          prompts/common/explanation_generation/user_prompt.txt
  claims_system: prompts/common/claims_extraction/system_prompt.txt
  claims_user:   prompts/common/claims_extraction/user_prompt.txt

lora:
  defaults:
    max_length: 1024
    lora_rank: 8
    lora_alpha: 8
    lora_dropout: 0.05
    learning_rate: 2.0e-4
    batch_size: 4
    gradient_accumulation_steps: 8
    num_epochs: 5
    load_in_4bit: true
  models:
    - name: deepseek_qwen_1_5b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    - name: deepseek_qwen_7b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
    - name: deepseek_qwen_14b
      model_name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"

pipeline:
  n_explanation_samples: 1
  n_claims_samples: 1
  claims_max_tokens: 2048
  few_shot_per_class: 1
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  distance_threshold: 0.01
  class_diff_threshold: 0.02
  min_cluster_size: 1
  max_assign_distance: 0.45

optuna:
  n_trials: 30

output:
  base_dir:      results/age
  summary_stats: summary_stats.txt
  clients_stats: clients_stats.jsonl
  prompts:       prompts.jsonl
  explanations:  explanations.jsonl
  claims:        claims.jsonl
  metrics:       metrics.json

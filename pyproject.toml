[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretable-transaction-features"
version = "1.0.0"
description = "Reproducible LLM-derived features for financial event sequences"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Mikhail Chaichuk"},
  {name = "Elena Tutubalina"},
  {name = "Andrey Savchenko"},
  {name = "Alexander Panchenko"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "openai>=1.30",
  "sentence-transformers>=2.7",
  "xgboost>=2.0",
  "optuna>=3",
  "pyarrow>=15",
  "tqdm>=4",
  "joblib>=1.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
boosters = ["lightgbm>=4.0", "catboost>=1.2"]
lora = ["torch>=2.1", "transformers>=4.45", "datasets>=2.19", "peft>=0.12", "bitsandbytes>=0.43"]
reports = ["jinja2>=3.1", "plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
data = ["datasets>=2.19"]

[project.scripts]
ife = "interpretable_features.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"interpretable_features.data" = ["splits/*.json"]
"interpretable_features.reporting" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
